name: mangao_wrs
description: "Mangao Water Refilling Station - Order, Inventory, Sales & Delivery Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # Maps (OpenStreetMap, free), GPS, and opening the phone / Google Maps
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.1
  # Real-time updates from the server (WebSocket, Java server)
  web_socket_channel: ^3.0.3
  # Photo of a damaged gallon (camera or gallery; file picker in Chrome)
  image_picker: ^1.1.2
  # Export Report on a phone: the phone's own Save screen (Downloads)
  file_picker: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
