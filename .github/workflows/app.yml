# Builds the Mangao WRS app every time the code changes on GitHub:
#  - Android app (APK): GitHub > Releases > "Mangao WRS app (latest)" > mangao-wrs.apk
#  - Web app (phone or laptop browser): https://skiptyred8.github.io/mangao-wrs/
# Both talk to the online server written in deploy/server-url.txt.
name: App build

on:
  push:
    branches: [main]
    paths: ['app/**', 'deploy/server-url.txt', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Server address
        run: |
          echo "API_URL=$(tr -d ' \r\n' < ../deploy/server-url.txt)" >> "$GITHUB_ENV"
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Prepare Android and web projects
        run: |
          flutter --version | tee ../build-report.txt
          flutter create --platforms=web,android --org com.mangao --project-name mangao_wrs . > /dev/null
          python3 ci/patch_android.py > /dev/null
          flutter pub get

      - name: App icon
        continue-on-error: true
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons

      - name: Check the code (flutter analyze)
        run: |
          echo "== flutter analyze ==" >> ../build-report.txt
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ../build-report.txt

      - name: Build web app
        run: |
          echo "== build web ==" >> ../build-report.txt
          flutter build web --release --base-href /mangao-wrs/ --dart-define=API_URL="$API_URL" --dart-define=APP_VERSION="$VERSION" 2>&1 | tail -40 | tee -a ../build-report.txt
          test -f build/web/index.html
          # Phones must not keep an old copy of the web app: a version mark on the app files makes the
          # browser load the new ones, and an old offline copy (service worker) removes itself.
          cd build/web
          sed -i "s#flutter_bootstrap.js#flutter_bootstrap.js?v=$VERSION#" index.html
          sed -i 's#<head>#<head>\n  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">#' index.html
          sed -i "s#\"mainJsPath\":\"main.dart.js\"#\"mainJsPath\":\"main.dart.js?v=$VERSION\"#" flutter_bootstrap.js
          grep -q "main.dart.js?v=" flutter_bootstrap.js && echo "web: version mark added ($VERSION)" | tee -a ../../../build-report.txt || echo "web: main.dart.js mark not added" | tee -a ../../../build-report.txt
          printf '%s\n' "self.addEventListener('install', () => self.skipWaiting());" \
            "self.addEventListener('activate', (e) => e.waitUntil(caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))).then(() => self.registration.unregister())));" \
            > flutter_service_worker.js

      - name: Phone notification settings (Firebase)
        env:
          FB_JSON: ${{ secrets.FIREBASE_ANDROID_JSON }}
        run: |
          defs=$(python3 ci/firebase_defines.py)
          echo "FB_DEFINES=$defs" >> "$GITHUB_ENV"
          if [ -n "$defs" ]; then echo "push: on (Firebase settings found)" | tee -a ../build-report.txt; else echo "push: off (add the FIREBASE_ANDROID_JSON secret to turn it on)" | tee -a ../build-report.txt; fi

      - name: Build Android app
        run: |
          echo "== build apk ==" >> ../build-report.txt
          flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}" --dart-define=API_URL="$API_URL" --dart-define=APP_VERSION="$VERSION" $FB_DEFINES 2>&1 | tail -40 | tee -a ../build-report.txt
          cp build/app/outputs/flutter-apk/app-release.apk ../mangao-wrs.apk

      - name: Publish the Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest mangao-wrs.apk build-report.txt \
            --title "Mangao WRS app (latest) - version $VERSION" \
            --notes "Android app version $VERSION, built from commit ${GITHUB_SHA::7}. Server: $API_URL. On the phone: download mangao-wrs.apk and open it (allow installing from this source). A newer version installs over the old one." \
            --target "$GITHUB_SHA" --latest
          # Make sure the download page shows it (a release can stay an unpublished draft).
          gh release edit app-latest --draft=false --latest || true
          test "$(gh release view app-latest --json isDraft --jq .isDraft)" = "false"

      - name: Upload web app for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      - name: Build report (also when the build fails)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          echo "== result: ${{ job.status }} at commit ${GITHUB_SHA::7} ==" >> build-report.txt
          gh release delete build-report --yes --cleanup-tag 2>/dev/null || true
          gh release create build-report build-report.txt --title "Last app build report" \
            --notes "Output of the last app build (commit ${GITHUB_SHA::7})." --target "$GITHUB_SHA" --prerelease --latest=false
          gh release edit build-report --draft=false || true

  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
