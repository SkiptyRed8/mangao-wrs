# The free online server sleeps after 15 minutes without visitors (the next visitor then waits about a
# minute). This visits it every 10 minutes so customers do not wait. It also keeps the free database active.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - name: Visit /health
        run: |
          URL=$(tr -d ' \r\n' < deploy/server-url.txt)
          curl -sS --max-time 90 "$URL/health" || true
