# Checks the online server from outside: health, how long it answers, and a log-in with a wrong
# password (no real password needed). Results show as notes on the run (Actions > Server status).
name: Server status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - name: Addresses of the server name
        run: |
          URL=$(tr -d ' \r\n' < deploy/server-url.txt); HOST=${URL#https://}
          echo "::notice title=IPv4 (A)::$(dig +short A $HOST | tr '\n' ' ')"
          echo "::notice title=IPv6 (AAAA)::$(dig +short AAAA $HOST | tr '\n' ' ')"
          echo "::notice title=certificate::$(echo | openssl s_client -connect $HOST:443 -servername $HOST 2>/dev/null | openssl x509 -noout -issuer -enddate | tr '\n' ' ')"
      - name: Check
        run: |
          URL=$(tr -d ' \r\n' < deploy/server-url.txt)
          HOST=$(echo "$URL" | sed -E 's#https?://([^/]+).*#\1#')
          echo "::notice title=DNS A::$(dig +short A $HOST | tr '\n' ' ')"
          echo "::notice title=DNS AAAA (IPv6)::$(dig +short AAAA $HOST | tr '\n' ' ')"
          echo "::notice title=certificate::$(echo | openssl s_client -servername $HOST -connect $HOST:443 2>/dev/null | openssl x509 -noout -issuer -dates 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=certificate chain::$(echo | openssl s_client -showcerts -servername $HOST -connect $HOST:443 2>/dev/null | grep -E '^ *[0-9] s:|i:' | tr '\n' ' ' | head -c 900)"
          for i in 1 2 3; do
            out=$(curl -s -o /tmp/h.json -w "%{http_code} %{time_total}s" --max-time 120 "$URL/health" || echo "no answer")
            echo "::notice title=health try $i::$out $(head -c 300 /tmp/h.json 2>/dev/null)"
            sleep 5
          done
          out=$(curl -s -o /tmp/l.json -w "%{http_code} %{time_total}s" --max-time 120 -H "Content-Type: application/json" \
            -d '{"phone":"09170000001","password":"wrong-password-check"}' "$URL/api/auth/login" || echo "no answer")
          echo "::notice title=login (wrong password)::$out $(head -c 200 /tmp/l.json 2>/dev/null)"
          out=$(curl -s -o /tmp/s.json -w "%{http_code} %{time_total}s" --max-time 120 -H "Content-Type: application/json" \
            -d '{"phone":"09170000002","password":"staff123"}' "$URL/api/auth/login" || echo "no answer")
          echo "::notice title=login (demo staff)::$out $(head -c 120 /tmp/s.json | sed 's/"token":"[^"]*"/"token":"..."/')"
          tok=$(python3 -c "import json;print(json.load(open('/tmp/s.json')).get('token',''))" 2>/dev/null)
          if [ -n "$tok" ]; then
            for p in /api/auth/me /api/notifications/unread /api/work/todo; do
              out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 60 -H "Authorization: Bearer $tok" "$URL$p" || echo "no answer")
              echo "::notice title=$p::$out"
            done
            out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 60 -H "Authorization: Bearer $tok" -H "Content-Type: application/json" \
              -d '{"token":"status-check-token-0123456789abcdefgh","platform":"android"}' "$URL/api/notifications/device" || echo "no answer")
            echo "::notice title=device token::$out"
          fi
      - name: As the app
        run: |
          URL=$(tr -d ' \r\n' < deploy/server-url.txt)
          for ua in "Dart/3.13 (dart:io)" "okhttp/4.12.0"; do
            out=$(curl -s -o /tmp/d.txt -w "%{http_code} %{time_total}s" --max-time 60 -A "$ua" "$URL/health" || echo "no answer")
            echo "::notice title=health as $ua::$out $(head -c 150 /tmp/d.txt)"
            out=$(curl -s -o /tmp/d.txt -w "%{http_code} %{time_total}s" --max-time 60 -A "$ua" -H "Content-Type: application/json" -d '{"phone":"09170000002","password":"staff123"}' "$URL/api/auth/login" || echo "no answer")
            echo "::notice title=login as $ua::$out $(head -c 60 /tmp/d.txt)"
          done

      - name: Map services (through the server)
        run: |
          URL=$(tr -d ' \r\n' < deploy/server-url.txt)
          tok=$(curl -s --max-time 90 -H "Content-Type: application/json" -d '{"phone":"09170000002","password":"staff123"}' "$URL/api/auth/login" | python3 -c "import json,sys;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          for p in "/api/geo/search?q=Commonwealth%20Avenue" "/api/geo/search?q=Riverside%20Street" "/api/geo/search?q=SM%20Fairview" "/api/geo/reverse?lat=14.692823&lng=121.0871699" "/api/geo/route?from=14.692823,121.0871699&to=14.70,121.09"; do
            out=$(curl -s -o /tmp/g.json -w "%{http_code} %{time_total}s" --max-time 60 -H "Authorization: Bearer $tok" "$URL$p" || echo "no answer")
            echo "::notice title=$p::$out $(head -c 300 /tmp/g.json)"
          done
          out=$(curl -s -o /tmp/n.json -w "%{http_code} %{time_total}s" --max-time 30 -A "MangaoWRS/1.0 (school project, Quezon City)" "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&countrycodes=ph&bounded=1&viewbox=120.98,14.78,121.14,14.58&q=Commonwealth%20Avenue")
          echo "::notice title=Nominatim direct from GitHub::$out $(head -c 300 /tmp/n.json)"
